name: Repository Rust toolchain
description: Install the nightly and components pinned by rust-toolchain.toml.

inputs:
  components:
    description: Override components for lightweight jobs.
    required: false

outputs:
  toolchain:
    description: The toolchain selected by rust-toolchain.toml.
    value: ${{ steps.pin.outputs.toolchain }}

runs:
  using: composite
  steps:
    - name: Read toolchain pin
      id: pin
      shell: bash
      env:
        REQUESTED_COMPONENTS: ${{ inputs.components }}
      run: |
        toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r')
        test -n "$toolchain"
        components="$REQUESTED_COMPONENTS"
        if [ -z "$components" ]; then
          components=$(sed -n 's/^components = //p' rust-toolchain.toml | tr -d '[] "\r')
        fi
        printf 'toolchain=%s\ncomponents=%s\n' "$toolchain" "$components" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.pin.outputs.toolchain }}
        components: ${{ steps.pin.outputs.components }}
