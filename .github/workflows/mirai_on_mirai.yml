name: MIRAI on MIRAI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  READ_ONLY_GITHUB_TOKEN: ${{ github.token }}

jobs:
  self-analysis:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
      - name: Build MIRAI with the bundled solver
        run: cargo build --locked -p mirai
      - name: Run MIRAI on MIRAI
        run: |
          mkdir -p "$RUNNER_TEMP/mirai-bin"
          cp target/debug/mirai target/debug/cargo-mirai "$RUNNER_TEMP/mirai-bin/"
          export PATH="$RUNNER_TEMP/mirai-bin:$PATH"
          cargo mirai --locked --manifest-path checker/Cargo.toml --no-default-features
