name: Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  READ_ONLY_GITHUB_TOKEN: ${{ github.token }}

jobs:
  format-and-workflows:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        id: rust
        with:
          components: rustfmt
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: actionlint@1.7.12
      - name: Check formatting
        run: cargo +${{ steps.rust.outputs.toolchain }} fmt --all -- --check
      - name: Check workflows
        run: actionlint

  clippy:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
      - name: Run Clippy
        run: cargo clippy --locked --workspace --no-default-features --all-targets -- -D warnings

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Locate libclang on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clangDirectory = Split-Path (Get-Command clang).Source
          "LIBCLANG_PATH=$clangDirectory" >> $env:GITHUB_ENV
      - name: Locate libclang on macOS
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(dirname "$(xcrun --find clang)")")/lib" >> "$GITHUB_ENV"
      - name: Execute tests
        run: cargo nextest run --locked --workspace --profile ci

  publish-dry-run:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
      - name: Verify crate publication without uploading
        run: cargo publish --locked --dry-run -p mirai-annotations -p mirai-standard-contracts -p mirai
